<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Social Links Profile</title>
  </head>
  <body>
    <main>
      <article class="social-profile-card">
        <div class="top-box">
          <img alt="Avatar" src="assets/images/avatar-jessica.jpeg" />
        </div>
        <div class="main-box">
          <h2 class="name">Jessica Rendall</h2>
          <h3 class="address">London, United Kindom</h3>
          <p class="job">"Frontend developer and avid reader"</p>
        </div>
        <div class="bottom-box">
          <ul class="social-links">
            <li><a href="#" class="link">Github</a></li>
            <li><a href="#" class="link">Frontend Mentor</a></li>
            <li><a href="#" class="link">Linkedin</a></li>
            <li><a href="#" class="link">Twitter</a></li>
            <li><a href="#" class="link">Instgrams</a></li>
          </ul>
        </div>
      </article>
    </main>
  </body>
</html>
